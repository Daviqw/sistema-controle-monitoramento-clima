spring:
  application:
    name: sistema-controle-clima
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clima}
    username: ${DB_USER:clima_app}
    password: ${DB_PASSWORD:clima_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-this-key-to-at-least-32-bytes}
      expiration-ms: ${JWT_EXPIRATION:3600000}
    frontend:
      origin: ${FRONTEND_ORIGIN:http://localhost:4200}
      shared-key: ${FRONTEND_SHARED_KEY:dev-only-frontend-key}
  seed:
    admin-email: ${ADMIN_INITIAL_EMAIL:admin@clima.local}
    admin-password: ${ADMIN_INITIAL_PASSWORD:change-me-in-dev}
